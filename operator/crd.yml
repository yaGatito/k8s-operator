apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: manageddatabases.tt.yagatito.com
spec:
  group: tt.yagatito.com
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["engine", "sizeGB"]
              properties:
                engine:
                  type: string
                sizeGB:
                  type: integer
            status:
              type: object
              properties:
                id:
                  type: string
                state:
                  type: string
                endpoint:
                  type: string
  scope: Namespaced
  names:
    plural: manageddatabases
    singular: manageddatabase
    kind: ManagedDatabase
    shortNames:
      - mdb